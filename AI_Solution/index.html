function baseline(o){const c=carton(db.config.baselineCarton)||db.cartons[db.cartons.length-1];if(!c)return 0;const material=Math.ceil(2*(c.l*c.w+c.l*c.h+c.w*c.h)/10000*(isFragile(o)?2:1))*db.config.cushionRate;const shipping=Math.ceil(Math.max(weight(o),c.l*c.w*c.h/db.config.divisor))*15000;return c.price+material+shipping}
function toast(message,error=false){const el=document.getElementById('toastroot');el.innerHTML=`<div class="toast ${error?'error':''}">${esc(message)}</div>`;setTimeout(()=>el.innerHTML='',3000)}
function setPage(page){state.page=page;state.recommendation=null;state.selectedOrder=null;render()}
function pageMeta(){return {overview:['Tổng quan','TỔNG QUAN','Theo dõi hoạt động đóng gói và hiệu quả ước tính.'],orders:['Đơn hàng','PACKING STATION','Chọn đơn hàng, chạy MiniTwin và xác nhận hoàn tất đóng gói.'],store:['Mock Storefront','KHÁCH HÀNG','Tạo đơn giả lập với danh mục sản phẩm Lock&Lock.'],analytics:['Báo cáo hiệu quả','ANALYTICS','So sánh chi phí đóng gói đề xuất với phương pháp baseline.'],products:['Danh mục sản phẩm','MASTER DATA','Quản lý thông số SKU dùng trong bài toán tối ưu.'],cartons:['Danh mục thùng carton','MASTER DATA','Quản lý kích thước, sức chịu tải và tồn kho thùng.'],settings:['Cấu hình thuật toán','CẤU HÌNH','Cài đặt giả định và hằng số sử dụng trong bản demo.']}[state.page]}
function renderNav(){const pages=[['overview','◫','Tổng quan'],['store','▣','Mock Storefront'],['orders','▤','Packing Station'],['analytics','▥','Báo cáo & phân tích']];const pending=db.orders.filter(o=>o.status==='waiting').length;document.getElementById('nav').innerHTML=pages.map(([id,ico,name])=>`<button class="navbtn ${state.page===id?'active':''}" data-page="${id}"><span class="navico">${ico}</span>${name}${id==='orders'?`<span class="navcount">${pending}</span>`:''}</button>`).join('')+`<div class="navlabel" style="margin-top:18px">QUẢN LÝ DỮ LIỆU</div>`+[['products','◇','Sản phẩm (SKU)'],['cartons','▱','Thùng carton']].map(([id,ico,name])=>`<button class="navbtn ${state.page===id?'active':''}" data-page="${id}"><span class="navico">${ico}</span>${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page))}
function head(title,eyebrow,description,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`}
function stat(label,value,unit,icon){return `<div class="stat"><div class="statlabel">${label}</div><div class="statrow"><div><span class="statnum">${value}</span> <span class="statunit">${unit}</span></div><span class="staticon">${icon}</span></div></div>`}
function overview(){const packed=db.orders.filter(o=>o.status==='packed');const savings=packed.reduce((a,o)=>a+Math.max(0,baseline(o)-orderCost(o)),0);const avg=packed.length?Math.round(packed.reduce((a,o)=>{const c=carton(o.result.cartonId);return a+(c?100*(1-volume(o)/(c.l*c.w*c.h)):0)},0)/packed.length):0;const q=db.orders.filter(o=>o.status==='waiting');return `${head('Xin chào, Minh 👋','PACKING OVERVIEW','Đây là không gian vận hành thử nghiệm của MiniTwin.')}
<div class="stats">${stat('Đơn đã đóng gói',packed.length,'đơn','✓')}${stat('Đang chờ xử lý',q.length,'đơn','◷')}${stat('Tiết kiệm ước tính',money(savings),'demo','↘')}${stat('Khoảng trống TB',avg,'% thể tích','▱')}</div>
<div class="dashboardgrid"><div class="card"><div class="cardhead"><div><div class="cardtitle">Chi phí đóng gói · Đã hoàn thành</div><div class="sub">So sánh MiniTwin và baseline trên ${packed.length} đơn demo đã xử lý</div></div><button class="btn small" data-page="analytics">Chi tiết →</button></div><div class="barcompare"><div><div class="barlabel"><span>Baseline · thùng lớn</span><b>${money(packed.reduce((a,o)=>a+baseline(o),0))}</b></div><div class="bartrack"><div class="barfill base" style="width:100%"></div></div></div><div><div class="barlabel"><span>MiniTwin · tối ưu ràng buộc</span><b class="green">${money(packed.reduce((a,o)=>a+orderCost(o),0))}</b></div><div class="bartrack"><div class="barfill" style="width:${Math.max(12,packed.reduce((a,o)=>a+baseline(o),0)?packed.reduce((a,o)=>a+orderCost(o),0)/packed.reduce((a,o)=>a+baseline(o),0)*100:0)}%"></div></div></div></div><div class="legend"><span><i class="dot" style="background:#c6cec7"></i>Phương pháp baseline</span><span><i class="dot" style="background:#236b50"></i>Gợi ý MiniTwin</span></div></div>
<div class="card"><div class="cardhead"><div><div class="cardtitle">Hàng đợi đóng gói</div><div class="sub">Các đơn mới cần xử lý</div></div><button class="btn small" data-page="orders">Mở trạm →</button></div><div class="queue">${q.length?q.slice(0,4).map(o=>`<div class="queueitem" data-order="${o.id}"><div><div class="ordercode">${o.id}</div><div class="orderdesc">${o.items.reduce((a,i)=>a+i[1],0)} sản phẩm · ${isFragile(o)?'Có hàng dễ vỡ':'Hàng thường'}</div></div><span class="push badge wait">Chờ xử lý</span></div>`).join(''):`<div class="empty">Không có đơn chờ đóng gói</div>`}</div></div></div><div class="notice" style="margin-top:16px">ⓘ <b>Số liệu mô phỏng:</b> Giá vận chuyển là ước tính demo theo trọng lượng tính cước × đơn giá giả định; chưa tích hợp bảng giá thực tế của hãng vận chuyển. Không đại diện cho số liệu nội bộ Lock&Lock.</div>`}
function orderCard(o){const names=o.items.map(([id,q])=>`${esc(prod(id)?.name||id)} × ${q}`).join(' · ');return `<div class="queueitem" data-order="${o.id}"><div style="min-width:0"><div class="ordercode">${o.id}</div><div class="orderdesc" style="max-width:350px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${names}</div></div><span class="push badge ${o.status==='packed'?'packed':'wait'}">${o.status==='packed'?'Đã đóng gói':'Chờ xử lý'}</span></div>`}
function store(){let items=Object.entries(state.cart).filter(([,q])=>q>0);let total=items.reduce((a,[id,q])=>a+(prod(id)?.price||0)*q,0);let list=db.products.filter(p=>(p.name+' '+p.id+' '+p.category).toLowerCase().includes(state.search.toLowerCase()));return `${head('Cửa hàng giả lập','MOCK STOREFRONT','Thêm sản phẩm vào giỏ để tạo đơn test Mixed-SKU.','<button class="btn" data-action="clear-cart">Làm trống giỏ</button>')}<div class="twocol"><div class="card"><div class="cardhead"><div><div class="cardtitle">Danh mục sản phẩm</div><div class="sub">${db.products.length} SKU · dữ liệu demo</div></div><input class="input search" id="searchStore" placeholder="Tìm sản phẩm…" value="${esc(state.search)}"></div><div class="tablewrap"><table class="table"><thead><tr><th>Sản phẩm</th><th>Giá tham khảo</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div style="display:flex;gap:9px;align-items:center"><span style="font-size:18px">${p.emoji||'📦'}</span><div><b>${esc(p.name)}</b><div class="muted">${p.id} · ${p.l}×${p.w}×${p.h} cm ${p.fragile?'· ✧ Dễ vỡ':''}</div></div></div></td><td>${money(p.price)}</td><td><button class="btn small primary" data-add="${p.id}">+ Thêm</button></td></tr>`).join('')}</tbody></table></div></div><div class="card" style="position:sticky;top:90px"><div class="cardhead"><div><div class="cardtitle">Giỏ hàng</div><div class="sub">${items.reduce((a,x)=>a+x[1],0)} sản phẩm · ${items.length} SKU</div></div><span class="staticon">▣</span></div>${items.length?items.map(([id,q])=>`<div class="cartline"><div><div class="cartname">${esc(prod(id)?.name||id)}</div><div class="cartmeta">${money(prod(id)?.price||0)} / món</div></div><input class="quantity-input" type="number" min="1" max="999" value="${q}" data-cartqty="${id}"><b style="font-size:10px">${money((prod(id)?.price||0)*q)}</b><button class="remove" data-remove="${id}">×</button></div>`).join(''):`<div class="empty">Giỏ hàng đang trống.<br>Thêm sản phẩm để bắt đầu demo.</div>`}<div class="totalrow"><span>Tổng giá trị sản phẩm</span><span>${money(total)}</span></div><button class="btn primary" style="width:100%;justify-content:center" data-action="checkout" ${items.length?'':'disabled'}>Đặt hàng →</button><div class="sub" style="text-align:center;margin-top:10px">Đơn mới sẽ xuất hiện ngay tại Packing Station.</div></div></div>`}
function recommendationPane(o){if(!o)return `<div class="card"><div class="placeholder"><div class="big">◈</div><b>Chọn một đơn hàng để bắt đầu</b>Chạy thuật toán để xem gợi ý thùng phù hợp và chi phí dự kiến.</div></div>`;if(!state.recommendation)return `<div class="card"><div class="placeholder"><div class="big">⟡</div><b>Đơn ${o.id} đã sẵn sàng</b>${o.items.length} SKU · ${o.items.reduce((a,i)=>a+i[1],0)} sản phẩm · ${isFragile(o)?'Có hàng dễ vỡ':'Hàng không dễ vỡ'}<div style="margin-top:16px"><button class="btn primary" data-action="run">Chạy thuật toán tìm thùng <span>→</span></button></div><div class="sub" style="margin-top:12px">Kiểm tra kích thước · thể tích · tải trọng · tồn kho</div></div></div>`;const r=state.recommendation;if(!r.ok)return `<div class="card"><div class="placeholder"><div class="big">⚠</div><b>Chưa tìm thấy thùng khả thi</b><p style="line-height:1.7;max-width:360px;margin:8px auto 13px">${r.reason}</p><button class="btn" data-action="split">Gợi ý chia đơn</button></div></div>`;const {carton:c,cost,fragile,buffer,productVol}=r;const bl=baseline(o),saving=bl-cost.total;return `<div class="card"><div class="cardhead"><div><div class="cardtitle">Kết quả MiniTwin</div><div class="sub">Đơn ${o.id} · phương án khả thi có chi phí thấp nhất</div></div><span class="badge packed">✓ Khả thi</span></div><div class="resulthero"><div><div style="opacity:.7;font-size:10px">THÙNG ĐƯỢC ĐỀ XUẤT</div><h3>${c.id} · ${esc(c.name)}</h3><p>${fmtSize(c)} · Tồn kho ${c.stock} thùng</p></div><div class="cartonillustration"></div></div><div style="font-size:10px;font-weight:700;color:#6d786f">ƯỚC TÍNH CHI PHÍ</div><div class="costrows"><div class="costrow"><span>Thùng carton · ${c.id}</span><b>${money(c.price)}</b></div><div class="costrow"><span>Vật liệu đệm${fragile?' · 2 lớp':''}</span><b>${money(cost.material)}</b></div><div class="costrow"><span>Vận chuyển · ${db.config.carrier}</span><b>${money(cost.shipping)}</b></div><div class="costrow" style="padding-top:9px;border-top:1px solid #edf0ed"><b>Tổng ước tính</b><b>${money(cost.total)}</b></div></div><div class="cardtitle" style="margin-top:15px">Vì sao chọn thùng này?</div><div class="checks"><div class="check"><i>✓</i>Kích thước sản phẩm và cách xếp giả định phù hợp kích thước trong thùng.</div><div class="check"><i>✓</i>Thể tích sản phẩm ${Math.round(productVol).toLocaleString('vi-VN')} cm³ + khoảng hở ${buffer}% nằm trong sức chứa.</div><div class="check"><i>✓</i>Tải trọng ${weight(o).toFixed(2)} kg phù hợp giới hạn thùng (${c.strength} kg).</div><div class="check"><i>✓</i>Còn hàng trong kho · ${c.stock} thùng khả dụng.</div></div>${fragile?`<div class="warnbox">✧ <b>Hướng dẫn:</b> Đơn có hàng thủy tinh, quấn ít nhất 2 lớp màng xốp; chèn kín các khoảng trống trước khi niêm phong.</div>`:`<div class="notice">Đặt sản phẩm ở giữa thùng và chèn vật liệu đệm để hạn chế dịch chuyển.</div>`}<div class="compare"><div class="comparebox"><div class="comparelabel">Baseline · ${esc(carton(db.config.baselineCarton)?.id||'thùng lớn')}</div><div class="compareval">${money(bl)}</div><div class="comparehint">Dùng thùng lớn mặc định</div></div><div class="comparebox highlight"><div class="comparelabel">MiniTwin · ${c.id}</div><div class="compareval">${money(cost.total)}</div><div class="comparehint">Thùng khả thi tối ưu chi phí</div>${saving>0?`<div class="savings">↓ Tiết kiệm ${money(saving)} · ${Math.round(saving/bl*100)}%</div>`:`<div class="savings" style="color:#92713a">Chi phí cao hơn baseline</div>`}</div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-action="override" style="flex:1">Chọn thùng khác</button><button class="btn primary" data-action="pack" style="flex:1">Xác nhận đóng gói ✓</button></div><div class="sub" style="margin-top:10px">Chi phí vận chuyển là ước tính mô phỏng, không phải bảng giá thực tế.</div></div>`}
function orders(){const list=[...db.orders].sort((a,b)=>b.created-a.created);let chosen=db.orders.find(o=>o.id===state.selectedOrder);return `${head('Packing Station','PACKING WORKSPACE','Tiếp nhận đơn hàng và tối ưu lựa chọn thùng.')}<div class="twocol"><div class="card"><div class="cardhead"><div><div class="cardtitle">Hàng đợi đơn hàng</div><div class="sub">${db.orders.filter(o=>o.status==='waiting').length} đơn đang chờ · ${db.orders.filter(o=>o.status==='packed').length} đã hoàn tất</div></div><button class="btn small" data-page="store">＋ Tạo đơn mới</button></div><div class="queue">${list.length?list.map(orderCard).join(''):`<div class="empty">Chưa có đơn hàng</div>`}</div></div><div id="recommendation">${recommendationPane(chosen)}</div></div>`}
function analytics(){const packed=db.orders.filter(o=>o.status==='packed'&&o.result);const totalBase=packed.reduce((a,o)=>a+baseline(o),0),totalOpt=packed.reduce((a,o)=>a+orderCost(o),0);const saved=totalBase-totalOpt;const avgSpace=packed.length?Math.round(packed.reduce((a,o)=>{const c=carton(o.result.cartonId);return a+(c?100*(1-volume(o)/(c.l*c.w*c.h)):0)},0)/packed.length):0;let rows=packed.map(o=>`<tr><td><b>${o.id}</b></td><td>${carton(o.result.cartonId)?.id||'—'}</td><td>${money(baseline(o))}</td><td>${money(orderCost(o))}</td><td class="green"><b>${money(Math.max(0,baseline(o)-orderCost(o)))}</b></td></tr>`).join('');return `${head('Hiệu quả tối ưu','ANALYTICS & INSIGHTS','Đối chiếu kết quả mô phỏng MiniTwin với phương pháp baseline.')}<div class="stats">${stat('Tổng đơn đã đóng gói',packed.length,'đơn','✓')}${stat('Tổng chi phí baseline',money(totalBase),'ước tính','▤')}${stat('Chi phí MiniTwin',money(totalOpt),'ước tính','◈')}${stat('Tiết kiệm mô phỏng',money(saved),totalBase?Math.round(saved/totalBase*100)+'%':'','↘')}</div><div class="dashboardgrid"><div class="card"><div class="cardhead"><div><div class="cardtitle">So sánh tổng chi phí</div><div class="sub">${packed.length} đơn đã hoàn tất · VNĐ</div></div><span class="badge">Mô phỏng</span></div><div class="barcompare" style="margin-top:25px"><div><div class="barlabel"><span>Baseline · ${esc(carton(db.config.baselineCarton)?.id||'thùng lớn')}</span><b>${money(totalBase)}</b></div><div class="bartrack" style="height:15px"><div class="barfill base" style="width:100%"></div></div></div><div><div class="barlabel"><span>MiniTwin · carton khả thi rẻ nhất</span><b class="green">${money(totalOpt)}</b></div><div class="bartrack" style="height:15px"><div class="barfill" style="width:${totalBase?Math.max(4,totalOpt/totalBase*100):0}%"></div></div></div></div><div class="notice" style="margin-top:22px">${saved>=0?'MiniTwin giảm chi phí ước tính':'MiniTwin có chi phí cao hơn baseline'} <b>${money(Math.abs(saved))}</b> trên tập đơn đã hoàn tất.</div></div><div class="card"><div class="cardhead"><div><div class="cardtitle">Chỉ số sử dụng không gian</div><div class="sub">Trung bình trên thùng đã chọn</div></div></div><div style="display:flex;align-items:center;gap:16px;padding:15px 0"><div style="font:800 40px Manrope;color:var(--green)">${avgSpace}<span style="font-size:19px">%</span></div><div><div style="font-weight:700;font-size:12px">Khoảng trống ước tính</div><div class="muted">Tỷ lệ trống trung bình trong carton đã chọn.</div></div></div><div class="bartrack" style="height:12px"><div class="barfill" style="width:${avgSpace}%"></div></div><div class="sub" style="margin-top:15px">Chỉ số tính từ tổng thể tích SKU / thể tích thùng. Không mô phỏng cách xếp 3D thực tế.</div></div></div><div class="card" style="margin-top:16px"><div class="cardhead"><div><div class="cardtitle">Chi tiết theo đơn hàng</div><div class="sub">Chi phí đóng gói và vận chuyển giả định</div></div><button class="btn small" data-action="export">↓ Xuất CSV</button></div>${packed.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Mã đơn</th><th>Thùng</th><th>Baseline</th><th>MiniTwin</th><th>Chênh lệch</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Chưa có đơn hoàn tất để thống kê</div>`}</div><div class="notice" style="margin-top:14px">Các mức giá trong dashboard là dữ liệu giả định phục vụ trình diễn, không chứng minh mức tiết kiệm thực tế tại Lock&Lock.</div>`}
function products(){const rows=db.products.filter(p=>(p.id+' '+p.name).toLowerCase().includes(state.search.toLowerCase())).map(p=>`<tr><td><b>${esc(p.id)}</b></td><td>${p.emoji||'📦'} ${esc(p.name)}<div class="muted">${esc(p.category)}</div></td><td>${p.l} × ${p.w} × ${p.h}</td><td>${p.weight} kg</td><td>${p.fragile?'<span class="badge wait">✧ Dễ vỡ</span>':'<span class="badge">Thường</span>'}</td><td>${money(p.price)}</td><td><button class="iconbtn" data-editprod="${p.id}">✎</button><button class="iconbtn" data-deleteprod="${p.id}">×</button></td></tr>`).join('');return `${head('Danh mục sản phẩm','SKU MASTER DATA','Dữ liệu mô phỏng · cập nhật kích thước, trọng lượng và tính chất hàng hóa.','<button class="btn primary" data-action="new-product">＋ Thêm SKU</button>')}<div class="card"><div class="filterrow"><input id="searchProducts" class="input search" placeholder="Tìm SKU hoặc tên…" value="${esc(state.search)}"><span class="sub">${db.products.length} sản phẩm</span></div><div class="tablewrap"><table class="table"><thead><tr><th>SKU</th><th>Tên sản phẩm</th><th>Kích thước (cm)</th><th>Khối lượng</th><th>Tính chất</th><th>Giá bán tham khảo</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Không tìm thấy sản phẩm</td></tr>'}</tbody></table></div></div>`}
function cartons(){const rows=db.cartons.map(c=>`<tr><td><b>${esc(c.id)}</b></td><td>${esc(c.name)}</td><td>${fmtSize(c)}</td><td>${money(c.price)}</td><td>${c.strength} kg</td><td><span class="stock">${c.stock} thùng</span></td><td><button class="iconbtn" data-editcarton="${c.id}">✎</button><button class="iconbtn" data-deletecarton="${c.id}">×</button></td></tr>`).join('');return `${head('Danh mục carton','CARTON MASTER DATA','Quản lý kích thước trong, đơn giá, giới hạn tải trọng và tồn kho.','<button class="btn primary" data-action="new-carton">＋ Thêm thùng</button>')}<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Mã thùng</th><th>Tên thùng</th><th>Kích thước trong</th><th>Đơn giá</th><th>Tải trọng</th><th>Tồn kho</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="notice" style="margin-top:14px">Sức chịu tải và tồn kho là giả định demo. Hãy thay bằng thông số do nhóm xác minh khi có dữ liệu.</div>`}
function settings(){let c=db.config;return `${head('Cấu hình thuật toán','SYSTEM CONFIGURATION','Các giả định áp dụng cho bộ lọc khả thi và ước tính chi phí.')}<div class="settingsgrid"><div class="card"><div class="cardhead"><div><div class="cardtitle">Ràng buộc đóng gói</div><div class="sub">Khoảng hở tối thiểu quanh sản phẩm</div></div><span class="staticon">⚙</span></div><div class="field"><label>Clearance hàng thường (%)</label><input class="input" type="number" min="0" max="80" id="bufferPlastic" value="${c.bufferPlastic}"></div><div class="field"><label>Clearance hàng dễ vỡ (%)</label><input class="input" type="number" min="0" max="80" id="bufferFragile" value="${c.bufferFragile}"></div><div class="field"><label>Thùng baseline so sánh</label><select class="select" id="baselineCarton">${db.cartons.map(x=>`<option value="${x.id}" ${x.id===c.baselineCarton?'selected':''}>${x.id} · ${esc(x.name)}</option>`).join('')}</select></div></div><div class="card"><div class="cardhead"><div><div class="cardtitle">Vận chuyển & vật liệu</div><div class="sub">Đơn giá minh họa, có thể chỉnh để thử nghiệm</div></div><span class="staticon">↗</span></div><div class="field"><label>Hãng vận chuyển (giả lập)</label><select class="select" id="carrier"><option ${c.carrier==='GHN Express'?'selected':''}>GHN Express</option><option ${c.carrier==='GHTK Standard'?'selected':''}>GHTK Standard</option><option ${c.carrier==='Viettel Post'?'selected':''}>Viettel Post</option></select></div><div class="field"><label>Divisor quy đổi thể tích (cm³/kg)</label><input class="input" type="number" min="100" id="divisor" value="${c.divisor}"></div><div class="field"><label>Giá vật liệu đệm (VNĐ/mét giả định)</label><input class="input" type="number" min="0" id="cushionRate" value="${c.cushionRate}"></div><div class="field"><label>Đơn giá ship demo (VNĐ/kg tính cước)</label><input class="input" type="number" min="0" id="shipRate" value="${c.shipRate||15000}"></div></div></div><div style="display:flex;justify-content:flex-end;margin:15px 0"><button class="btn primary" data-action="save-settings">Lưu cấu hình</button></div><div class="notice">Đây là quy tắc tối ưu hóa ràng buộc, không phải mô hình Machine Learning. Kích thước SKU được kiểm tra theo thứ tự sắp xếp cố định và giả định xếp đơn giản; demo chưa giải bài toán xếp 3D. Divisor và cước tính ship là tham số mô phỏng, cần kiểm tra chính sách hiện hành của hãng trước khi dùng thực tế.</div><div class="card" style="margin-top:15px"><div class="cardhead"><div><div class="cardtitle">Quản lý vai trò · Demo</div><div class="sub">Chuyển vai trò để trình diễn giao diện từng người dùng.</div></div></div><div class="filterrow"><button class="btn ${state.role==='customer'?'primary':''}" data-role="customer">🛍 Khách hàng</button><button class="btn ${state.role==='staff'?'primary':''}" data-role="staff">▤ Nhân viên</button><button class="btn ${state.role==='manager'?'primary':''}" data-role="manager">◫ Quản lý</button><button class="btn ${state.role==='admin'?'primary':''}" data-role="admin">⚙ Admin</button></div><div class="sub">Phân quyền chỉ phục vụ mô phỏng giao diện. Không có đăng nhập hay bảo mật RBAC phía máy chủ.</div></div>`}
function render(){renderNav();const meta=pageMeta();document.getElementById('crumb').textContent=meta[0];const views={overview,store,orders,analytics,products,cartons,settings};document.getElementById('app').innerHTML=views[state.page]();bind();}
function openModal(title,desc,fields,submit,label='Lưu'){state.modal={submit};document.getElementById('modalroot').innerHTML=`<div class="modalback" data-dismiss><div class="modal" onclick="event.stopPropagation()"><h2>${title}</h2><p>${desc}</p><form id="modalform">${fields}<div class="modalactions"><button type="button" class="btn" data-cancel>Hủy</button><button class="btn primary" type="submit">${label}</button></div></form></div></div>`;document.querySelector('[data-dismiss]').onclick=e=>{if(e.target.matches('[data-dismiss]'))closeModal()};document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('#modalform').onsubmit=e=>{e.preventDefault();state.modal.submit(new FormData(e.currentTarget));closeModal()};}
function closeModal(){state.modal=null;document.getElementById('modalroot').innerHTML=''}
function productFields(p={}){return `<div class="field"><label>Mã SKU</label><input class="input" name="id" value="${esc(p.id||'')}" ${p.id?'readonly':''} required></div><div class="field"><label>Tên sản phẩm</label><input class="input" name="name" value="${esc(p.name||'')}" required></div><div class="settingsgrid"><div class="field"><label>Dài (cm)</label><input class="input" name="l" type="number" step="0.1" value="${p.l||''}" required></div><div class="field"><label>Rộng (cm)</label><input class="input" name="w" type="number" step="0.1" value="${p.w||''}" required></div><div class="field"><label>Cao (cm)</label><input class="input" name="h" type="number" step="0.1" value="${p.h||''}" required></div><div class="field"><label>Khối lượng (kg)</label><input class="input" name="weight" type="number" step="0.01" value="${p.weight||''}" required></div></div><div class="field"><label>Danh mục</label><input class="input" name="category" value="${esc(p.category||'Lock&Lock · Demo')}"></div><div class="field"><label>Giá tham khảo (VNĐ)</label><input class="input" name="price" type="number" value="${p.price||0}"></div><label style="font-size:11px"><input type="checkbox" name="fragile" ${p.fragile?'checked':''}> Hàng dễ vỡ (thủy tinh)</label>`}
function cartonFields(c={}){return `<div class="field"><label>Mã thùng</label><input class="input" name="id" value="${esc(c.id||'')}" ${c.id?'readonly':''} required></div><div class="field"><label>Tên thùng</label><input class="input" name="name" value="${esc(c.name||'')}" required></div><div class="settingsgrid">${[['l','Dài trong (cm)'],['w','Rộng trong (cm)'],['h','Cao trong (cm)'],['price','Giá thùng (VNĐ)'],['strength','Tải trọng (kg)'],['stock','Tồn kho (cái)']].map(([k,l])=>`<div class="field"><label>${l}</label><input class="input" name="${k}" type="number" step="${k==='price'||k==='stock'?1:.1}" value="${c[k]??''}" required></div>`).join('')}</div>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll('[data-order]').forEach(el=>el.onclick=()=>{state.selectedOrder=el.dataset.order;state.recommendation=null;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.cart[b.dataset.add]=(state.cart[b.dataset.add]||0)+1;render()});document.querySelectorAll('[data-cartqty]').forEach(x=>x.onchange=()=>{state.cart[x.dataset.cartqty]=Math.max(1,+x.value||1);render()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{delete state.cart[x.dataset.remove];render()});const ss=document.getElementById('searchStore');if(ss)ss.oninput=()=>{state.search=ss.value;const pos=ss.selectionStart;render();const n=document.getElementById('searchStore');n.focus();n.setSelectionRange(pos,pos)};const sp=document.getElementById('searchProducts');if(sp)sp.oninput=()=>{state.search=sp.value;const pos=sp.selectionStart;render();let n=document.getElementById('searchProducts');n.focus();n.setSelectionRange(pos,pos)};document.querySelector('[data-action="clear-cart"]')?.addEventListener('click',()=>{state.cart={};render()});document.querySelector('[data-action="checkout"]')?.addEventListener('click',checkout);document.querySelector('[data-action="run"]')?.addEventListener('click',runAlgorithm);document.querySelector('[data-action="pack"]')?.addEventListener('click',packOrder);document.querySelector('[data-action="override"]')?.addEventListener('click',overrideOrder);document.querySelector('[data-action="split"]')?.addEventListener('click',splitOrder);document.querySelector('[data-action="new-product"]')?.addEventListener('click',()=>openModal('Thêm SKU mới','Thông số sản phẩm phục vụ thuật toán MiniTwin.',productFields(),f=>{let p=Object.fromEntries(f);if(db.products.some(x=>x.id===p.id))return toast('Mã SKU đã tồn tại',true);for(let k of ['l','w','h','weight','price'])p[k]=+p[k]||0;p.fragile=f.has('fragile');p.emoji=p.fragile?'🫙':'📦';db.products.push(p);save();render();toast('Đã thêm SKU')}));document.querySelectorAll('[data-editprod]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.editprod);openModal('Chỉnh sửa SKU',p.id,productFields(p),f=>{Object.assign(p,Object.fromEntries(f));for(let k of ['l','w','h','weight','price'])p[k]=+p[k]||0;p.fragile=f.has('fragile');save();render();toast('Đã cập nhật SKU')})});document.querySelectorAll('[data-deleteprod]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.deleteprod);if(!confirm(`Xóa ${p.id} khỏi danh mục?`))return;db.products=db.products.filter(x=>x.id!==p.id);save();render();toast('Đã xóa SKU')});document.querySelector('[data-action="new-carton"]')?.addEventListener('click',()=>openModal('Thêm thùng carton','Nhập kích thước trong lòng thùng và giới hạn tải trọng.',cartonFields(),f=>{let c=Object.fromEntries(f);if(db.cartons.some(x=>x.id===c.id))return toast('Mã thùng đã tồn tại',true);for(let k of ['l','w','h','price','strength','stock'])c[k]=+c[k]||0;db.cartons.push(c);save();render();toast('Đã thêm thùng')}));document.querySelectorAll('[data-editcarton]').forEach(b=>b.onclick=()=>{let c=carton(b.dataset.editcarton);openModal('Chỉnh sửa thùng',c.id,cartonFields(c),f=>{Object.assign(c,Object.fromEntries(f));for(let k of ['l','w','h','price','strength','stock'])c[k]=+c[k]||0;save();render();toast('Đã cập nhật thùng')})});document.querySelectorAll('[data-deletecarton]').forEach(b=>b.onclick=()=>{let c=carton(b.dataset.deletecarton);if(!confirm(`Xóa thùng ${c.id}?`))return;db.cartons=db.cartons.filter(x=>x.id!==c.id);save();render();toast('Đã xóa thùng')});document.querySelector('[data-action="save-settings"]')?.addEventListener('click',()=>{let g=id=>document.getElementById(id);db.config.bufferPlastic=+g('bufferPlastic').value;db.config.bufferFragile=+g('bufferFragile').value;db.config.baselineCarton=g('baselineCarton').value;db.config.carrier=g('carrier').value;db.config.divisor=Math.max(100,+g('divisor').value||5000);db.config.cushionRate=+g('cushionRate').value||0;db.config.shipRate=+g('shipRate').value||0;save();state.recommendation=null;toast('Đã lưu cấu hình')});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;let names={customer:'Customer (Mock)',staff:'Packing Staff',manager:'Warehouse Manager',admin:'System Admin'};document.getElementById('roleName').textContent=names[state.role];toast('Đang xem dưới vai trò '+names[state.role])});document.querySelector('[data-action="export"]')?.addEventListener('click',exportCsv)}
function checkout(){let items=Object.entries(state.cart).filter(([,q])=>q>0);if(!items.length)return toast('Giỏ hàng đang trống',true);const n=db.orders.reduce((a,o)=>Math.max(a,+(o.id.match(/(\d+)$/)?.[1]||0)),0)+1;const id='ORD-2026-'+String(n).padStart(3,'0');db.orders.unshift({id,items:items.map(([k,v])=>[k,v]),status:'waiting',created:Date.now()});state.cart={};save();toast(`Đặt hàng thành công · ${id}`);state.page='orders';state.selectedOrder=id;state.recommendation=null;render()}
function runAlgorithm(){const o=db.orders.find(x=>x.id===state.selectedOrder);if(!o)return;let r=orderRecommendation(o);if(!r){const estimate=db.cartons.filter(c=>c.stock>0).map(c=>({c,fit:c.l>=Math.max(...o.items.map(([id])=>prod(id)?.l||0))&&c.w>=Math.max(...o.items.map(([id])=>prod(id)?.w||0))&&c.h>=o.items.reduce((a,[id,q])=>a+(prod(id)?.h||0)*q,0)&&c.strength>=weight(o)}));const oversized=estimate.some(x=>x.c.l>=Math.max(...o.items.map(([id])=>prod(id)?.l||0))&&x.c.w>=Math.max(...o.items.map(([id])=>prod(id)?.w||0))&&x.c.h>=o.items.reduce((a,[id,q])=>a+(prod(id)?.h||0)*q,0));state.recommendation={ok:false,reason:oversized?'Thùng hiện có không đáp ứng đồng thời yêu cầu khoảng hở bảo vệ và sức chứa. Có thể chia đơn thành nhiều kiện nhỏ hơn.':'Không có thùng tồn kho nào đủ kích thước hoặc tải trọng cho đơn này. Vui lòng bổ sung thùng phù hợp hoặc chia đơn.'}}else{const c=r.carton;const material=Math.ceil(2*(c.l*c.w+c.l*c.h+c.w*c.h)/10000*(r.fragile?2:1))*db.config.cushionRate;const shipping=Math.ceil(Math.max(weight(o),c.l*c.w*c.h/db.config.divisor))*(db.config.shipRate||15000);r.cost={material,shipping,total:c.price+material+shipping};state.recommendation={ok:true,...r}}render()}
function packOrder(){const o=db.orders.find(x=>x.id===state.selectedOrder),r=state.recommendation;if(!o||!r?.ok)return;const c=carton(r.carton.id);if(!c||c.stock<=0)return toast('Thùng vừa hết tồn kho. Chạy lại thuật toán.',true);c.stock--;o.status='packed';o.result={cartonId:c.id,material:r.cost.material,shipping:r.cost.shipping,override:false};o.packedAt=Date.now();save();toast(`${o.id} đã đóng gói · ${c.id}`);render()}
function overrideOrder(){const o=db.orders.find(x=>x.id===state.selectedOrder),r=state.recommendation;if(!o||!r?.ok)return;const options=r.feasible.filter(c=>c.id!==r.carton.id);if(!options.length)return toast('Không còn thùng thay thế khả thi',true);openModal('Ghi đè lựa chọn','Chọn một thùng khả thi khác và ghi rõ lý do.',`<div class="field"><label>Thùng thay thế</label><select class="select" name="cartonId">${options.map(c=>`<option value="${c.id}">${c.id} · ${esc(c.name)} · ${fmtSize(c)} · ${money((()=>{const mat=Math.ceil(2*(c.l*c.w+c.l*c.h+c.w*c.h)/10000*(r.fragile?2:1))*db.config.cushionRate;const ship=Math.ceil(Math.max(weight(o),c.l*c.w*c.h/db.config.divisor))*(db.config.shipRate||15000);return c.price+mat+ship})())}</option>`).join('')}</select></div><div class="field"><label>Lý do ghi đè (bắt buộc)</label><input class="input" name="reason" placeholder="Ví dụ: thùng đề xuất hết hàng tại trạm" required></div>`,f=>{let nc=carton(f.get('cartonId'));if(!nc||nc.stock<=0)return toast('Thùng thay thế không còn tồn kho',true);const material=Math.ceil(2*(nc.l*nc.w+nc.l*nc.h+nc.w*nc.h)/10000*(r.fragile?2:1))*db.config.cushionRate;const shipping=Math.ceil(Math.max(weight(o),nc.l*nc.w*nc.h/db.config.divisor))*(db.config.shipRate||15000);nc.stock--;o.status='packed';o.result={cartonId:nc.id,material,shipping,override:true,reason:f.get('reason')};save();toast(`Đã ghi đè và đóng gói · ${nc.id}`);render()},'Ghi đè & hoàn tất')}
function splitOrder(){let o=db.orders.find(x=>x.id===state.selectedOrder);if(!o)return;let items=[];for(const [id,q] of o.items){for(let i=0;i<q;i++)items.push([id,1])}if(items.length<2)return toast('Đơn chỉ có một sản phẩm. Cần bổ sung thùng lớn hơn.',true);let a=items.slice(0,Math.ceil(items.length/2)),b=items.slice(Math.ceil(items.length/2));const next=db.orders.reduce((m,x)=>Math.max(m,+(x.id.match(/(\d+)$/)?.[1]||0)),0)+1;let id1=`ORD-2026-${String(next).padStart(3,'0')}`,id2=`ORD-2026-${String(next+1).padStart(3,'0')}`;o.status='split';db.orders.unshift({id:id1,items:a,status:'waiting',created:Date.now()},{id:id2,items:b,status:'waiting',created:Date.now()});save();toast(`Đã gợi ý chia thành hai đơn: ${id1} · ${id2}`);state.selectedOrder=id1;state.recommendation=null;render()}
function exportCsv(){const rows=[['Order ID','Carton','Baseline VND','MiniTwin VND','Saving VND'],...db.orders.filter(o=>o.status==='packed'&&o.result).map(o=>[o.id,o.result.cartonId,baseline(o),orderCost(o),baseline(o)-orderCost(o)])];let blob=new Blob(['\ufeff'+rows.map(x=>x.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minitwin-demo-report.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('today').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(new Date());render();document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){setPage(b.dataset.page);return}let o=e.target.closest('[data-order]');if(o&&state.page!=='orders'){state.page='orders';state.selectedOrder=o.dataset.order;state.recommendation=null;render()}});
</script></body></html>
